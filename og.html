<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/src/styles/tokens.css"><link rel="stylesheet" href="/src/styles/fonts.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:var(--font-body);color:#14120F}
.card{position:relative;width:1200px;height:630px;padding:70px 72px;box-sizing:border-box;background:linear-gradient(180deg,#BFE3FF 0%,#E4F2FF 55%,#F7F3EC 100%)}
.meta{font-weight:700;font-size:20px;color:#5C574E}
.name{margin-top:18px;font-family:var(--font-display);font-size:132px;line-height:.92;letter-spacing:-.02em;font-weight:700}
.name b{display:block;font-weight:700;color:#E8402F}
.tag{margin-top:30px;font-family:var(--font-display);font-weight:500;font-size:34px;line-height:1.2;max-width:520px}
.hoop{position:absolute;right:90px;top:95px;width:380px;height:380px;border-radius:50%;overflow:hidden;border:14px solid #F5B400;box-shadow:inset 0 0 0 6px #fff,inset 0 -10px 0 #C98F00;background:#EFE9DF}
.hoop img{width:100%;height:100%;object-fit:cover;object-position:50% 10%}
.ball{position:absolute;left:640px;bottom:60px;width:70px;height:70px;border-radius:50%;background:#E8402F;box-shadow:inset -10px -10px 0 rgba(0,0,0,.18)}
.ball i{position:absolute;top:20px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:inset 5px 5px 0 #14120F}
.ball i:first-child{left:14px}.ball i:last-child{right:14px}
.hill{position:absolute;left:0;right:0;bottom:0;height:44px;background:#5FBF4B;border-top:6px solid #3E8F33}
</style></head><body><div class="card">
<p class="meta">Founder’s office · Superjoin · Bengaluru</p>
<h1 class="name">Sagar<b>Kotian</b></h1>
<p class="tag">I like the part of a startup where nothing has an owner yet.</p>
<div class="hoop"><img src="/img/hero.jpg"></div>
<div class="hill"></div><div class="ball"><i></i><i></i></div>
</div></body></html>
