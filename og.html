<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/src/styles/tokens.css"><link rel="stylesheet" href="/src/styles/fonts.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:var(--font-text);color:var(--forest);background:var(--leaf)}
.card{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box}
.meta{font-weight:500;font-size:22px;color:var(--moss)}
.name{margin-top:14px;font-family:var(--font-display);font-weight:400;font-size:150px;line-height:.9;letter-spacing:-.015em;white-space:nowrap}
.tag{margin-top:44px;font-weight:500;font-size:38px;line-height:1.22;letter-spacing:-.015em;max-width:560px}
.hint{position:absolute;left:72px;bottom:72px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:22px;color:var(--moss)}
.hint i{width:14px;height:14px;border-radius:50%;background:var(--ball);box-shadow:inset -3px -3px 0 rgba(0,0,0,.18)}
.portrait{position:absolute;right:72px;top:300px;width:236px;height:296px;border-radius:14px;overflow:hidden;background:var(--leaf-2)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.rule{position:absolute;left:72px;right:72px;bottom:40px;height:2px;background:var(--forest)}
.ball{position:absolute;left:640px;bottom:42px;width:56px;height:56px;border-radius:50%;background:var(--ball);box-shadow:inset -8px -8px 0 rgba(0,0,0,.18)}
.ball i{position:absolute;top:16px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:inset 4px 4px 0 var(--forest)}
.ball i:first-child{left:11px}.ball i:last-child{right:11px}
</style></head><body><div class="card">
<p class="meta">Founder’s office · Superjoin · Bengaluru</p>
<h1 class="name">Sagar Kotian</h1>
<p class="tag">I like the part of a startup where nothing has an owner yet.</p>
<p class="hint"><i></i>press space to play</p>
<div class="portrait"><img src="/img/hero.jpg"></div>
<div class="rule"></div><div class="ball"><i></i><i></i></div>
</div></body></html>
